<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Torneo de Fútbol</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container my-2">
    <div class="text-center my-4">
      <img src="images/logo.png" alt="Torneo de fútbol" class="img-fluid" style="max-height: 100px;">
    </div>

    <ul class="nav nav-tabs" id="tabMenu" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link active" id="grupos-tab" data-bs-toggle="tab" data-bs-target="#grupos" type="button" role="tab">Grupos</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="posiciones-tab" data-bs-toggle="tab" data-bs-target="#posiciones" type="button" role="tab">Posiciones</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="jugados-tab" data-bs-toggle="tab" data-bs-target="#jugados" type="button" role="tab">Partidos Jugados</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="proximos-tab" data-bs-toggle="tab" data-bs-target="#proximos" type="button" role="tab">Próximos Partidos</button>
      </li>
    </ul>

    <div class="tab-content mt-4">
      <div class="tab-pane fade show active" id="grupos" role="tabpanel">
        <!-- Aquí van los grupos -->
        <div class="mb-4">
            <label for="grupoSelect" class="form-label">Selecciona un grupo:</label>
            <select id="grupoSelect" class="form-select w-auto d-inline-block">
              <option value="">Todos</option>
            </select>
          </div>
          <div id="gruposGrid" class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-xl-5 g-4"></div>
      </div>

      <div class="tab-pane fade" id="posiciones" role="tabpanel">
        <!-- Aquí van las posiciones -->
        <div class="mb-3">
            <label for="filtroGrupo" class="form-label">Filtrar por grupo:</label>
            <select id="filtroGrupo" class="form-select w-50">
              <option value="todos">Todos los grupos</option>
              <option value="A">Grupo A</option>
              <option value="B">Grupo B</option>
              <option value="C">Grupo C</option>
              <!-- Agrega más si tienes -->
            </select>
          </div>
        <div id="posicionesContent">
           
        </div>
      </div>

      <div class="tab-pane fade" id="jugados" role="tabpanel">
        <div class="mb-3">
            <label for="filtroEquipo" class="form-label">Filtrar por equipo</label>
            <select id="filtroEquipo" class="form-select" onchange="mostrarPartidosJugados()">
              <option value="">Todos los equipos</option>
            </select>
          </div>
        <div id="listaPartidosJugados">
           
        </div>
      </div>

      <div class="tab-pane fade" id="proximos" role="tabpanel">
        <div id="listaProximosPartidos"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
